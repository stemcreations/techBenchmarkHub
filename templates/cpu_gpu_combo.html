<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU + GPU Combo - Tech Benchmark Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }
        
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
        }
        
        .back-btn {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        
        .selection-section {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
        }
        
        .combo-selectors {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 30px;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .product-selector {
            text-align: center;
        }
        
        .product-selector h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .searchable-dropdown {
            position: relative;
            width: 100%;
        }
        
        .dropdown-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            background: white;
        }
        
        .dropdown-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #667eea;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        
        .dropdown-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        
        .dropdown-item:hover {
            background: #f0f0f0;
        }
        
        .dropdown-item:last-child {
            border-bottom: none;
        }
        
        .plus-text {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }
        
        .combo-section {
            padding: 30px;
        }
        
        .no-selection {
            text-align: center;
            color: #666;
            font-size: 1.1em;
            margin: 50px 0;
        }
        
        .combo-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        .product-column {
            background: #f8f9fa;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .column-header {
            padding: 20px;
            text-align: center;
            color: white;
        }
        
        .cpu-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .gpu-header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        }
        
        .column-header h2 {
            margin-bottom: 10px;
        }
        
        .column-content {
            padding: 20px;
            background: white;
        }
        
        .benchmark-group {
            margin-bottom: 30px;
        }
        
        .group-title {
            background: #333;
            color: white;
            padding: 12px 15px;
            border-radius: 8px 8px 0 0;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .benchmark-item {
            padding: 15px;
            border-left: 1px solid #ddd;
            border-right: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            background: white;
        }
        
        .benchmark-item:last-child {
            border-radius: 0 0 8px 8px;
        }
        
        .benchmark-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .benchmark-result {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .score-display {
            font-size: 1.4em;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 6px;
            color: white;
        }
        
        .score-available {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
        }
        
        .score-na {
            background: #6c757d;
        }
        
        .unit-label {
            font-size: 0.9em;
            color: #666;
        }
        
        .low-fps {
            font-size: 1.1em;
            font-weight: bold;
            color: #ff6b6b;
            margin-top: 5px;
        }
        
        @media (max-width: 1024px) {
            .combo-layout {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
        
        @media (max-width: 768px) {
            .combo-selectors {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .plus-text {
                order: -1;
            }
            
            .back-btn {
                position: static;
                transform: none;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-btn">← Back</a>
            <h1>⚡ CPU + GPU Combo</h1>
            <p>View CPU and GPU performance side by side</p>
        </div>
        
        <div class="selection-section">
            <div class="combo-selectors">
                <div class="product-selector">
                    <h3>💻 Select CPU</h3>
                    <div class="searchable-dropdown">
                        <input type="text" id="cpu-input" class="dropdown-input" placeholder="Type to search CPUs..." readonly>
                        <div id="cpu-list" class="dropdown-list"></div>
                    </div>
                </div>
                
                <div class="plus-text">+</div>
                
                <div class="product-selector">
                    <h3>🎮 Select GPU</h3>
                    <div class="searchable-dropdown">
                        <input type="text" id="gpu-input" class="dropdown-input" placeholder="Type to search GPUs..." readonly>
                        <div id="gpu-list" class="dropdown-list"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="combo-section">
            <div id="no-selection" class="no-selection">
                Select a CPU and GPU above to see their individual performance data
            </div>
            
            <div id="combo-results" class="combo-layout" style="display: none;">
                <div class="product-column">
                    <div class="column-header cpu-header">
                        <h2 id="cpu-name">CPU Performance</h2>
                        <p id="cpu-cores">-</p>
                    </div>
                    <div class="column-content" id="cpu-benchmarks">
                        <div class="no-selection">No CPU selected</div>
                    </div>
                </div>
                
                <div class="product-column">
                    <div class="column-header gpu-header">
                        <h2 id="gpu-name">GPU Performance</h2>
                    </div>
                    <div class="column-content" id="gpu-benchmarks">
                        <div class="no-selection">No GPU selected</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cpuData = {};
        let gpuData = {};
        let selectedCpu = null;
        let selectedGpu = null;
        
        // Load products on page load
        window.onload = function() {
            loadProducts();
        };

        async function loadProducts() {
            try {
                const [cpuResponse, gpuResponse] = await Promise.all([
                    fetch('/api/products?type=CPU'),
                    fetch('/api/products?type=GPU')
                ]);
                
                const cpus = await cpuResponse.json();
                const gpus = await gpuResponse.json();
                
                // Store data for later use
                cpus.forEach(cpu => {
                    cpuData[cpu.id] = cpu;
                });
                
                gpus.forEach(gpu => {
                    gpuData[gpu.id] = gpu;
                });
                
                // Setup searchable dropdowns
                setupSearchableDropdown('cpu', cpus, (cpu) => {
                    selectedCpu = cpu;
                    updateCombo();
                });
                
                setupSearchableDropdown('gpu', gpus, (gpu) => {
                    selectedGpu = gpu;
                    updateCombo();
                });
                
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        function setupSearchableDropdown(id, items, onSelect) {
            const input = document.getElementById(`${id}-input`);
            const list = document.getElementById(`${id}-list`);
            
            // Make input editable when clicked
            input.addEventListener('click', () => {
                input.removeAttribute('readonly');
                input.focus();
                showDropdown(list, items, input, onSelect, id);
            });
            
            // Handle typing
            input.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                const filtered = items.filter(item => 
                    item.name.toLowerCase().includes(query)
                );
                showDropdown(list, filtered, input, onSelect, id);
            });
            
            // Handle focus out
            input.addEventListener('blur', (e) => {
                // Delay hiding to allow for item clicks
                setTimeout(() => {
                    if (!list.contains(document.activeElement)) {
                        hideDropdown(list);
                        if (!getSelectedValue(id)) {
                            input.value = '';
                            input.setAttribute('readonly', 'readonly');
                        }
                    }
                }, 150);
            });
            
            // Handle keyboard navigation
            input.addEventListener('keydown', (e) => {
                const items = list.querySelectorAll('.dropdown-item');
                const current = list.querySelector('.dropdown-item.highlighted');
                
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    const next = current ? current.nextElementSibling : items[0];
                    if (next) highlightItem(next);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    const prev = current ? current.previousElementSibling : items[items.length - 1];
                    if (prev) highlightItem(prev);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (current) {
                        current.click();
                    }
                } else if (e.key === 'Escape') {
                    hideDropdown(list);
                    input.blur();
                }
            });
        }

        function showDropdown(list, items, input, onSelect, id) {
            list.innerHTML = '';
            list.style.display = 'block';
            
            if (items.length === 0) {
                const noResults = document.createElement('div');
                noResults.className = 'dropdown-item';
                noResults.textContent = `No ${id.toUpperCase()}s found`;
                noResults.style.color = '#999';
                list.appendChild(noResults);
                return;
            }
            
            items.slice(0, 20).forEach((item, index) => { // Limit to 20 results
                const div = document.createElement('div');
                div.className = 'dropdown-item';
                div.textContent = item.name;
                div.addEventListener('click', () => {
                    selectItem(input, item, onSelect, id);
                    hideDropdown(list);
                });
                list.appendChild(div);
                
                if (index === 0) highlightItem(div);
            });
        }

        function hideDropdown(list) {
            list.style.display = 'none';
        }

        function highlightItem(item) {
            // Remove previous highlight
            const prev = item.parentElement.querySelector('.highlighted');
            if (prev) prev.classList.remove('highlighted');
            
            // Add highlight
            item.classList.add('highlighted');
            item.style.backgroundColor = '#667eea';
            item.style.color = 'white';
        }

        function selectItem(input, item, onSelect, id) {
            input.value = item.name;
            input.setAttribute('readonly', 'readonly');
            onSelect(item);
        }

        function getSelectedValue(id) {
            return id === 'cpu' ? selectedCpu?.id : selectedGpu?.id;
        }

        async function updateCombo() {
            if (!selectedCpu && !selectedGpu) {
                document.getElementById('no-selection').style.display = 'block';
                document.getElementById('combo-results').style.display = 'none';
                return;
            }
            
            document.getElementById('no-selection').style.display = 'none';
            document.getElementById('combo-results').style.display = 'grid';
            
            // Update CPU section
            if (selectedCpu) {
                document.getElementById('cpu-name').textContent = selectedCpu.name;
                document.getElementById('cpu-cores').textContent = selectedCpu.core_count || 'Core count not available';
                await loadProductBenchmarks(selectedCpu.id, 'cpu');
            } else {
                document.getElementById('cpu-name').textContent = 'CPU Performance';
                document.getElementById('cpu-cores').textContent = '-';
                document.getElementById('cpu-benchmarks').innerHTML = '<div class="no-selection">No CPU selected</div>';
            }
            
            // Update GPU section
            if (selectedGpu) {
                document.getElementById('gpu-name').textContent = selectedGpu.name;
                await loadProductBenchmarks(selectedGpu.id, 'gpu');
            } else {
                document.getElementById('gpu-name').textContent = 'GPU Performance';
                document.getElementById('gpu-benchmarks').innerHTML = '<div class="no-selection">No GPU selected</div>';
            }
        }

        async function loadProductBenchmarks(productId, type) {
            try {
                const response = await fetch(`/api/product/${productId}/results`);
                const data = await response.json();
                
                // Group benchmarks
                const groups = groupBenchmarks(data.results);
                
                // Display benchmarks
                displayBenchmarks(groups, type);
                
            } catch (error) {
                console.error('Error loading benchmarks:', error);
            }
        }

        function groupBenchmarks(results) {
            const groups = {
                'Productivity': [],
                'Gaming': {}
            };
            
            results.forEach(result => {
                if (result.resolution) {
                    // Gaming benchmark
                    let gameName = result.benchmark_name;
                    
                    // Extract game name
                    if (gameName.includes('CPU Performance')) {
                        gameName = gameName.split(' CPU Performance')[0];
                    } else if (gameName.includes('Ultra')) {
                        gameName = gameName.split(' Ultra')[0];
                    } else if (gameName.includes('Max')) {
                        gameName = gameName.split(' Max')[0];
                    } else if (gameName.includes('High')) {
                        gameName = gameName.split(' High')[0];
                    } else if (gameName.includes('Maximum')) {
                        gameName = gameName.split(' Maximum')[0];
                    }
                    
                    if (!groups['Gaming'][gameName]) {
                        groups['Gaming'][gameName] = [];
                    }
                    groups['Gaming'][gameName].push(result);
                } else {
                    // Productivity benchmark
                    groups['Productivity'].push(result);
                }
            });
            
            return groups;
        }

        function displayBenchmarks(groups, type) {
            const container = document.getElementById(`${type}-benchmarks`);
            container.innerHTML = '';
            
            // Display Productivity benchmarks
            if (groups['Productivity'].length > 0) {
                const productivityDiv = createBenchmarkGroup('Productivity Benchmarks', groups['Productivity'], type);
                container.appendChild(productivityDiv);
            }
            
            // Display Gaming benchmarks
            Object.keys(groups['Gaming']).forEach(gameName => {
                const gameDiv = createBenchmarkGroup(gameName, groups['Gaming'][gameName], type);
                container.appendChild(gameDiv);
            });
        }

        function createBenchmarkGroup(groupTitle, benchmarks, type) {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'benchmark-group';
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'group-title';
            titleDiv.textContent = groupTitle;
            groupDiv.appendChild(titleDiv);
            
            benchmarks.forEach(benchmark => {
                const benchmarkDiv = createBenchmarkItem(benchmark, type);
                groupDiv.appendChild(benchmarkDiv);
            });
            
            return groupDiv;
        }

        function createBenchmarkItem(benchmark, type) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'benchmark-item';
            
            const nameDiv = document.createElement('div');
            nameDiv.className = 'benchmark-name';
            nameDiv.textContent = benchmark.benchmark_name + (benchmark.resolution ? ` (${benchmark.resolution})` : '');
            itemDiv.appendChild(nameDiv);
            
            const resultDiv = document.createElement('div');
            resultDiv.className = 'benchmark-result';
            
            const scoreDiv = document.createElement('div');
            scoreDiv.className = 'score-display score-available';
            scoreDiv.textContent = benchmark.score.toFixed(1);
            
            const unitDiv = document.createElement('div');
            unitDiv.className = 'unit-label';
            unitDiv.textContent = benchmark.unit_type;
            
            resultDiv.appendChild(scoreDiv);
            resultDiv.appendChild(unitDiv);
            
            // Add 1% low for GPU benchmarks
            if (type === 'gpu' && benchmark.score_1_percent_low) {
                const lowFpsDiv = document.createElement('div');
                lowFpsDiv.className = 'low-fps';
                lowFpsDiv.textContent = `1% Low: ${benchmark.score_1_percent_low.toFixed(1)} FPS`;
                resultDiv.appendChild(lowFpsDiv);
            }
            
            itemDiv.appendChild(resultDiv);
            
            return itemDiv;
        }

        // Add CSS for highlighted dropdown items
        const style = document.createElement('style');
        style.textContent = `
            .dropdown-item.highlighted {
                background-color: #667eea !important;
                color: white !important;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
