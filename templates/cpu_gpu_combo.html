<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU + GPU Combo - Tech Benchmark Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#6366f1'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="text-center mb-8 relative">
            <a href="/" class="absolute left-0 top-1/2 transform -translate-y-1/2 bg-white hover:bg-gray-50 text-gray-700 px-4 py-2 rounded-lg border border-gray-300 hover:border-gray-400 transition-colors duration-200 flex items-center gap-2">
                ← Back
            </a>
            <h1 class="text-3xl font-bold text-gray-900 mb-2">⚡ CPU + GPU Combo</h1>
            <p class="text-lg text-gray-600">View CPU and GPU performance side by side</p>
        </div>
        
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border border-gray-200">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                <div class="space-y-3">
                    <h3 class="text-lg font-semibold text-gray-900">💻 Select CPU</h3>
                    <div class="relative">
                        <input type="text" id="cpu-input" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-900 placeholder-gray-500" placeholder="Type to search CPUs..." readonly>
                        <div id="cpu-list" class="absolute z-50 w-full mt-1 bg-white border border-gray-300 rounded-lg shadow-lg max-h-60 overflow-y-auto hidden"></div>
                    </div>
                </div>
                
                <div class="text-center">
                    <div class="bg-purple-100 text-purple-800 font-bold text-xl px-6 py-3 rounded-full inline-block">+</div>
                </div>
                
                <div class="space-y-3">
                    <h3 class="text-lg font-semibold text-gray-900">🎮 Select GPU</h3>
                    <div class="relative">
                        <input type="text" id="gpu-input" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent bg-white text-gray-900 placeholder-gray-500" placeholder="Type to search GPUs..." readonly>
                        <div id="gpu-list" class="absolute z-50 w-full mt-1 bg-white border border-gray-300 rounded-lg shadow-lg max-h-60 overflow-y-auto hidden"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="space-y-6">
            <div id="no-selection" class="bg-white rounded-xl shadow-md p-12 text-center border border-gray-200">
                <div class="text-gray-400 text-6xl mb-4">⚡</div>
                <h3 class="text-xl font-semibold text-gray-900 mb-2">Select Components</h3>
                <p class="text-gray-600">Choose a CPU and GPU above to see their individual performance data side by side</p>
            </div>
            
            <div id="combo-results" class="grid grid-cols-1 lg:grid-cols-2 gap-6" style="display: none;">
                <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200">
                    <div class="bg-blue-600 text-white px-6 py-4">
                        <h2 class="text-xl font-bold" id="cpu-name">CPU Performance</h2>
                        <p class="text-blue-100" id="cpu-cores">-</p>
                    </div>
                    <div class="p-6" id="cpu-benchmarks">
                        <div class="text-center text-gray-500 py-8">No CPU selected</div>
                    </div>
                </div>
                
                <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200">
                    <div class="bg-red-600 text-white px-6 py-4">
                        <h2 class="text-xl font-bold" id="gpu-name">GPU Performance</h2>
                    </div>
                    <div class="p-6" id="gpu-benchmarks">
                        <div class="text-center text-gray-500 py-8">No GPU selected</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cpuData = {};
        let gpuData = {};
        let selectedCpu = null;
        let selectedGpu = null;
        
        // Load products on page load
        window.onload = function() {
            loadProducts();
        };

        async function loadProducts() {
            try {
                const [cpuResponse, gpuResponse] = await Promise.all([
                    fetch('/api/products?type=CPU'),
                    fetch('/api/products?type=GPU')
                ]);
                
                const cpus = await cpuResponse.json();
                const gpus = await gpuResponse.json();
                
                // Store data for later use
                cpus.forEach(cpu => {
                    cpuData[cpu.id] = cpu;
                });
                
                gpus.forEach(gpu => {
                    gpuData[gpu.id] = gpu;
                });
                
                // Setup searchable dropdowns
                setupSearchableDropdown('cpu', cpus, (cpu) => {
                    selectedCpu = cpu;
                    updateCombo();
                });
                
                setupSearchableDropdown('gpu', gpus, (gpu) => {
                    selectedGpu = gpu;
                    updateCombo();
                });
                
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        function setupSearchableDropdown(id, items, onSelect) {
            const input = document.getElementById(`${id}-input`);
            const list = document.getElementById(`${id}-list`);
            
            // Make input editable when clicked
            input.addEventListener('click', () => {
                input.removeAttribute('readonly');
                input.focus();
                showDropdown(list, items, input, onSelect, id);
            });
            
            // Handle typing
            input.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                const filtered = items.filter(item => 
                    item.name.toLowerCase().includes(query)
                );
                showDropdown(list, filtered, input, onSelect, id);
            });
            
            // Handle focus out
            input.addEventListener('blur', (e) => {
                // Delay hiding to allow for item clicks
                setTimeout(() => {
                    if (!list.contains(document.activeElement)) {
                        hideDropdown(list);
                        if (!getSelectedValue(id)) {
                            input.value = '';
                            input.setAttribute('readonly', 'readonly');
                        }
                    }
                }, 150);
            });
            
            // Handle keyboard navigation
            input.addEventListener('keydown', (e) => {
                const items = list.querySelectorAll('.dropdown-item');
                const current = list.querySelector('.dropdown-item.highlighted');
                
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    const next = current ? current.nextElementSibling : items[0];
                    if (next) highlightItem(next, id);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    const prev = current ? current.previousElementSibling : items[items.length - 1];
                    if (prev) highlightItem(prev, id);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (current) {
                        current.click();
                    }
                } else if (e.key === 'Escape') {
                    hideDropdown(list);
                    input.blur();
                }
            });
        }

        function showDropdown(list, items, input, onSelect, id) {
            list.innerHTML = '';
            list.classList.remove('hidden');
            
            if (items.length === 0) {
                const noResults = document.createElement('div');
                noResults.className = 'px-4 py-3 text-gray-500 text-sm';
                noResults.textContent = `No ${id.toUpperCase()}s found`;
                list.appendChild(noResults);
                return;
            }
            
            items.slice(0, 20).forEach((item, index) => { // Limit to 20 results
                const div = document.createElement('div');
                const hoverColor = id === 'cpu' ? 'hover:bg-blue-50 hover:text-blue-900' : 'hover:bg-red-50 hover:text-red-900';
                div.className = `px-4 py-3 cursor-pointer text-gray-900 ${hoverColor} transition-colors duration-150 border-b border-gray-100 last:border-b-0`;
                div.textContent = item.name;
                div.addEventListener('click', () => {
                    selectItem(input, item, onSelect, id);
                    hideDropdown(list);
                });
                list.appendChild(div);
                
                if (index === 0) highlightItem(div, id);
            });
        }

        function hideDropdown(list) {
            list.classList.add('hidden');
        }

        function highlightItem(item, id) {
            // Remove previous highlight
            const prev = item.parentElement.querySelector('.highlighted');
            if (prev) {
                prev.classList.remove('highlighted', 'bg-blue-500', 'bg-red-500', 'text-white');
                const hoverColor = id === 'cpu' ? 'hover:bg-blue-50 hover:text-blue-900' : 'hover:bg-red-50 hover:text-red-900';
                prev.className = `px-4 py-3 cursor-pointer text-gray-900 ${hoverColor} transition-colors duration-150 border-b border-gray-100 last:border-b-0`;
            }
            
            // Add highlight
            const bgColor = id === 'cpu' ? 'bg-blue-500' : 'bg-red-500';
            item.classList.add('highlighted', bgColor, 'text-white');
            item.classList.remove('hover:bg-blue-50', 'hover:text-blue-900', 'hover:bg-red-50', 'hover:text-red-900');
        }

        function selectItem(input, item, onSelect, id) {
            input.value = item.name;
            input.setAttribute('readonly', 'readonly');
            onSelect(item);
        }

        function getSelectedValue(id) {
            return id === 'cpu' ? selectedCpu?.id : selectedGpu?.id;
        }

        async function updateCombo() {
            if (!selectedCpu && !selectedGpu) {
                document.getElementById('no-selection').style.display = 'block';
                document.getElementById('combo-results').style.display = 'none';
                return;
            }
            
            document.getElementById('no-selection').style.display = 'none';
            document.getElementById('combo-results').style.display = 'grid';
            
            // Update CPU section
            if (selectedCpu) {
                document.getElementById('cpu-name').textContent = selectedCpu.name;
                document.getElementById('cpu-cores').textContent = selectedCpu.core_count || 'Core count not available';
                await loadProductBenchmarks(selectedCpu.id, 'cpu');
            } else {
                document.getElementById('cpu-name').textContent = 'CPU Performance';
                document.getElementById('cpu-cores').textContent = '-';
                document.getElementById('cpu-benchmarks').innerHTML = '<div class="text-center text-gray-500 py-8">No CPU selected</div>';
            }
            
            // Update GPU section
            if (selectedGpu) {
                document.getElementById('gpu-name').textContent = selectedGpu.name;
                await loadProductBenchmarks(selectedGpu.id, 'gpu');
            } else {
                document.getElementById('gpu-name').textContent = 'GPU Performance';
                document.getElementById('gpu-benchmarks').innerHTML = '<div class="text-center text-gray-500 py-8">No GPU selected</div>';
            }
        }

        async function loadProductBenchmarks(productId, type) {
            try {
                const response = await fetch(`/api/product/${productId}/results`);
                const data = await response.json();
                
                // Group benchmarks
                const groups = groupBenchmarks(data.results);
                
                // Display benchmarks
                displayBenchmarks(groups, type);
                
            } catch (error) {
                console.error('Error loading benchmarks:', error);
            }
        }

        function groupBenchmarks(results) {
            const groups = {
                'Productivity': [],
                'Gaming': {}
            };
            
            results.forEach(result => {
                if (result.resolution) {
                    // Gaming benchmark
                    let gameName = result.benchmark_name;
                    
                    // Extract game name
                    if (gameName.includes('CPU Performance')) {
                        gameName = gameName.split(' CPU Performance')[0];
                    } else if (gameName.includes('Ultra')) {
                        gameName = gameName.split(' Ultra')[0];
                    } else if (gameName.includes('Max')) {
                        gameName = gameName.split(' Max')[0];
                    } else if (gameName.includes('High')) {
                        gameName = gameName.split(' High')[0];
                    } else if (gameName.includes('Maximum')) {
                        gameName = gameName.split(' Maximum')[0];
                    }
                    
                    if (!groups['Gaming'][gameName]) {
                        groups['Gaming'][gameName] = [];
                    }
                    groups['Gaming'][gameName].push(result);
                } else {
                    // Productivity benchmark
                    groups['Productivity'].push(result);
                }
            });
            
            return groups;
        }

        function displayBenchmarks(groups, type) {
            const container = document.getElementById(`${type}-benchmarks`);
            container.innerHTML = '';
            
            // Display Productivity benchmarks
            if (groups['Productivity'].length > 0) {
                const productivityDiv = createBenchmarkGroup('Productivity Benchmarks', groups['Productivity'], type);
                container.appendChild(productivityDiv);
            }
            
            // Display Gaming benchmarks
            Object.keys(groups['Gaming']).forEach(gameName => {
                const gameDiv = createBenchmarkGroup(gameName, groups['Gaming'][gameName], type);
                container.appendChild(gameDiv);
            });
        }

        function createBenchmarkGroup(groupTitle, benchmarks, type) {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'mb-6';
            
            const titleDiv = document.createElement('div');
            const bgColor = type === 'cpu' ? 'bg-blue-100 text-blue-800' : 'bg-red-100 text-red-800';
            titleDiv.className = `${bgColor} px-4 py-2 rounded-lg font-semibold text-sm mb-3`;
            titleDiv.textContent = groupTitle;
            groupDiv.appendChild(titleDiv);
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'space-y-3';
            
            benchmarks.forEach(benchmark => {
                const benchmarkDiv = createBenchmarkItem(benchmark, type);
                contentDiv.appendChild(benchmarkDiv);
            });
            
            groupDiv.appendChild(contentDiv);
            return groupDiv;
        }

        function createBenchmarkItem(benchmark, type) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'bg-gray-50 rounded-lg p-4 border border-gray-200';
            
            const nameDiv = document.createElement('div');
            nameDiv.className = 'font-medium text-gray-900 mb-3 text-sm';
            nameDiv.textContent = benchmark.benchmark_name + (benchmark.resolution ? ` (${benchmark.resolution})` : '');
            itemDiv.appendChild(nameDiv);
            
            // Calculate proportional bar width
            let maxScale;
            let barWidth;
            
            if (type === 'gpu') {
                // For GPU benchmarks, typical FPS range from 30-200+
                maxScale = 250;
                barWidth = Math.max((benchmark.score / maxScale) * 100, 20);
            } else {
                // For CPU benchmarks, handle different unit types
                if (benchmark.unit_type === 'seconds') {
                    // For time-based: lower is better, use inverted scale
                    maxScale = 60; // Assume max reasonable time is 60 seconds
                    barWidth = Math.max(100 - ((benchmark.score / maxScale) * 100), 20);
                } else {
                    // For score-based: higher is better
                    maxScale = Math.max(benchmark.score * 1.5, 100); // Dynamic scale
                    barWidth = Math.max((benchmark.score / maxScale) * 100, 20);
                }
            }
            
            if (type === 'gpu' && benchmark.score_1_percent_low) {
                // GPU with touching bars layout
                
                // Average FPS Label (above bars)
                const avgFpsLabel = document.createElement('div');
                const labelColor = type === 'cpu' ? 'text-blue-700' : 'text-red-700';
                avgFpsLabel.className = `text-xs font-medium ${labelColor} mb-1`;
                avgFpsLabel.textContent = 'Average FPS';
                itemDiv.appendChild(avgFpsLabel);
                
                // Average FPS Bar (top bar)
                const avgFpsContainer = document.createElement('div');
                avgFpsContainer.className = 'relative';
                
                const avgFpsBackground = document.createElement('div');
                avgFpsBackground.className = 'w-full h-6 bg-gray-200 rounded-t-md';
                avgFpsContainer.appendChild(avgFpsBackground);
                
                const avgFpsDiv = document.createElement('div');
                const barColor = type === 'cpu' ? 'bg-blue-500' : 'bg-red-500';
                avgFpsDiv.className = `absolute top-0 left-0 h-6 ${barColor} rounded-t-md flex items-center justify-end pr-2 text-white font-semibold text-xs transition-all duration-300`;
                avgFpsDiv.textContent = benchmark.score.toFixed(1);
                avgFpsDiv.style.width = `${barWidth}%`;
                avgFpsContainer.appendChild(avgFpsDiv);
                
                itemDiv.appendChild(avgFpsContainer);
                
                // 1% Low FPS Bar (bottom bar, touching)
                const lowFpsContainer = document.createElement('div');
                lowFpsContainer.className = 'relative';
                
                const lowFpsBackground = document.createElement('div');
                lowFpsBackground.className = 'w-full h-6 bg-gray-200 rounded-b-md';
                lowFpsContainer.appendChild(lowFpsBackground);
                
                const lowFpsDiv = document.createElement('div');
                const lowBarColor = type === 'cpu' ? 'bg-blue-400' : 'bg-red-400';
                lowFpsDiv.className = `absolute top-0 left-0 h-6 ${lowBarColor} rounded-b-md flex items-center justify-end pr-2 text-white font-semibold text-xs transition-all duration-300`;
                lowFpsDiv.textContent = benchmark.score_1_percent_low.toFixed(1);
                
                const lowFpsWidth = Math.max((benchmark.score_1_percent_low / maxScale) * 100, 18);
                lowFpsDiv.style.width = `${lowFpsWidth}%`;
                lowFpsContainer.appendChild(lowFpsDiv);
                
                itemDiv.appendChild(lowFpsContainer);
                
                // 1% Low FPS Label (below bars)
                const lowFpsLabel = document.createElement('div');
                lowFpsLabel.className = `text-xs font-medium ${labelColor} mt-1`;
                lowFpsLabel.textContent = '1% Low FPS';
                itemDiv.appendChild(lowFpsLabel);
                
            } else {
                // Single bar layout (CPU or GPU without 1% low)
                const unitLabel = document.createElement('div');
                const labelColor = type === 'cpu' ? 'text-blue-700' : 'text-red-700';
                unitLabel.className = `text-xs font-medium ${labelColor} mb-1`;
                unitLabel.textContent = benchmark.unit_type;
                itemDiv.appendChild(unitLabel);
                
                const scoreContainer = document.createElement('div');
                scoreContainer.className = 'relative';
                
                const scoreBackground = document.createElement('div');
                scoreBackground.className = 'w-full h-6 bg-gray-200 rounded-md';
                scoreContainer.appendChild(scoreBackground);
                
                const scoreDiv = document.createElement('div');
                const barColor = type === 'cpu' ? 'bg-blue-500' : 'bg-red-500';
                scoreDiv.className = `absolute top-0 left-0 h-6 ${barColor} rounded-md flex items-center justify-end pr-2 text-white font-semibold text-xs transition-all duration-300`;
                scoreDiv.textContent = benchmark.score.toFixed(1);
                scoreDiv.style.width = `${barWidth}%`;
                scoreContainer.appendChild(scoreDiv);
                
                itemDiv.appendChild(scoreContainer);
            }
            
            return itemDiv;
        }

        // Tailwind handles all styling - no additional CSS needed
    </script>
</body>
</html>
