<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Comparison - Tech Benchmark Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#6366f1'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-4">
        <div class="text-center mb-4 relative">
            <a href="/" class="absolute left-0 top-1/2 transform -translate-y-1/2 bg-white hover:bg-gray-50 text-gray-700 px-3 py-1.5 rounded-lg border border-gray-300 hover:border-gray-400 transition-colors duration-200 flex items-center gap-2 text-sm">
                ← Back
            </a>
            <h1 class="text-2xl font-bold text-gray-900 mb-1">💻 CPU Comparison</h1>
            <p class="text-base text-gray-600">Compare two CPUs across all available benchmarks</p>
        </div>
        
        <div class="bg-white rounded-lg shadow-sm p-4 mb-4 border border-gray-200">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                <div class="space-y-2">
                    <h3 class="text-base font-semibold text-gray-900">CPU 1</h3>
                    <div class="relative">
                        <input type="text" id="cpu1-input" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-900 placeholder-gray-500 text-sm" placeholder="Type to search CPUs..." readonly>
                        <div id="cpu1-list" class="absolute z-50 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-48 overflow-y-auto hidden"></div>
                    </div>
                </div>
                
                <div class="text-center">
                    <div class="bg-blue-100 text-blue-800 font-bold text-lg px-4 py-2 rounded-full inline-block">VS</div>
                </div>
                
                <div class="space-y-2">
                    <h3 class="text-base font-semibold text-gray-900">CPU 2</h3>
                    <div class="relative">
                        <input type="text" id="cpu2-input" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-900 placeholder-gray-500 text-sm" placeholder="Type to search CPUs..." readonly>
                        <div id="cpu2-list" class="absolute z-50 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-48 overflow-y-auto hidden"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="space-y-4">
            <div id="no-selection" class="bg-white rounded-lg shadow-sm p-8 text-center border border-gray-200">
                <div class="text-gray-400 text-4xl mb-3">🔍</div>
                <h3 class="text-lg font-semibold text-gray-900 mb-1">Select CPUs to Compare</h3>
                <p class="text-sm text-gray-600">Choose two CPUs above to see their detailed benchmark comparison</p>
            </div>
            
            <div id="comparison-results" style="display: none;">
                <div class="bg-white rounded-lg shadow-sm p-4 mb-4 border border-gray-200">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="text-center p-3 bg-blue-50 rounded-md border border-blue-200" id="cpu1-info">
                            <h2 class="text-lg font-bold text-blue-900 mb-1" id="cpu1-name">-</h2>
                            <p class="text-sm text-blue-700" id="cpu1-cores">-</p>
                        </div>
                        <div class="text-center p-3 bg-indigo-50 rounded-md border border-indigo-200" id="cpu2-info">
                            <h2 class="text-lg font-bold text-indigo-900 mb-1" id="cpu2-name">-</h2>
                            <p class="text-sm text-indigo-700" id="cpu2-cores">-</p>
                        </div>
                    </div>
                </div>
                
                <div id="benchmark-groups" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        let cpuData = {};
        let allCpus = [];
        let selectedCpu1 = null;
        let selectedCpu2 = null;
        
        // Load CPUs on page load
        window.onload = function() {
            loadCPUs();
        };

        async function loadCPUs() {
            try {
                const response = await fetch('/api/products?type=CPU');
                const cpus = await response.json();
                
                allCpus = cpus;
                
                // Store CPU data for later use
                cpus.forEach(cpu => {
                    cpuData[cpu.id] = cpu;
                });
                
                // Setup searchable dropdowns
                setupSearchableDropdown('cpu1', cpus, (cpu) => {
                    selectedCpu1 = cpu;
                    updateComparison();
                });
                
                setupSearchableDropdown('cpu2', cpus, (cpu) => {
                    selectedCpu2 = cpu;
                    updateComparison();
                });
                
            } catch (error) {
                console.error('Error loading CPUs:', error);
            }
        }

        function setupSearchableDropdown(id, items, onSelect) {
            const input = document.getElementById(`${id}-input`);
            const list = document.getElementById(`${id}-list`);
            
            // Make input editable when clicked
            input.addEventListener('click', () => {
                input.removeAttribute('readonly');
                input.focus();
                showDropdown(list, items, input, onSelect, id);
            });
            
            // Handle typing
            input.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                const filtered = items.filter(item => 
                    item.name.toLowerCase().includes(query)
                );
                showDropdown(list, filtered, input, onSelect, id);
            });
            
            // Handle focus out
            input.addEventListener('blur', (e) => {
                // Delay hiding to allow for item clicks
                setTimeout(() => {
                    if (!list.contains(document.activeElement)) {
                        hideDropdown(list);
                        if (!getSelectedValue(id)) {
                            input.value = '';
                            input.setAttribute('readonly', 'readonly');
                        }
                    }
                }, 150);
            });
            
            // Handle keyboard navigation
            input.addEventListener('keydown', (e) => {
                const items = list.querySelectorAll('.dropdown-item');
                const current = list.querySelector('.dropdown-item.highlighted');
                
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    const next = current ? current.nextElementSibling : items[0];
                    if (next) highlightItem(next);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    const prev = current ? current.previousElementSibling : items[items.length - 1];
                    if (prev) highlightItem(prev);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (current) {
                        current.click();
                    }
                } else if (e.key === 'Escape') {
                    hideDropdown(list);
                    input.blur();
                }
            });
        }

        function showDropdown(list, items, input, onSelect, id) {
            list.innerHTML = '';
            list.classList.remove('hidden');
            
            if (items.length === 0) {
                const noResults = document.createElement('div');
                noResults.className = 'px-4 py-3 text-gray-500 text-sm';
                noResults.textContent = 'No CPUs found';
                list.appendChild(noResults);
                return;
            }
            
            items.slice(0, 20).forEach((item, index) => { // Limit to 20 results
                const div = document.createElement('div');
                div.className = 'px-3 py-2 cursor-pointer text-gray-900 hover:bg-blue-50 hover:text-blue-900 transition-colors duration-150 border-b border-gray-100 last:border-b-0 text-sm';
                div.textContent = item.name;
                div.addEventListener('click', () => {
                    selectItem(input, item, onSelect, id);
                    hideDropdown(list);
                });
                list.appendChild(div);
                
                if (index === 0) highlightItem(div);
            });
        }

        function hideDropdown(list) {
            list.classList.add('hidden');
        }

        function highlightItem(item) {
            // Remove previous highlight
            const prev = item.parentElement.querySelector('.highlighted');
            if (prev) {
                prev.classList.remove('highlighted', 'bg-blue-500', 'text-white');
                prev.classList.add('hover:bg-blue-50', 'hover:text-blue-900');
            }
            
            // Add highlight
            item.classList.add('highlighted', 'bg-blue-500', 'text-white');
            item.classList.remove('hover:bg-blue-50', 'hover:text-blue-900');
        }

        function selectItem(input, item, onSelect, id) {
            input.value = item.name;
            input.setAttribute('readonly', 'readonly');
            setSelectedValue(id, item.id);
            onSelect(item);
        }

        function getSelectedValue(id) {
            return id === 'cpu1' ? selectedCpu1?.id : selectedCpu2?.id;
        }

        function setSelectedValue(id, value) {
            if (id === 'cpu1') {
                selectedCpu1 = value ? cpuData[value] : null;
            } else {
                selectedCpu2 = value ? cpuData[value] : null;
            }
        }

        async function updateComparison() {
            if (!selectedCpu1 || !selectedCpu2) {
                document.getElementById('no-selection').style.display = 'block';
                document.getElementById('comparison-results').style.display = 'none';
                return;
            }
            
            document.getElementById('no-selection').style.display = 'none';
            document.getElementById('comparison-results').style.display = 'block';
            
            // Update CPU info
            document.getElementById('cpu1-name').textContent = selectedCpu1.name;
            document.getElementById('cpu1-cores').textContent = selectedCpu1.core_count || 'Core count not available';
            document.getElementById('cpu2-name').textContent = selectedCpu2.name;
            document.getElementById('cpu2-cores').textContent = selectedCpu2.core_count || 'Core count not available';
            
            // Clear any existing overall performance indicators
            const cpu1Info = document.getElementById('cpu1-info');
            const cpu2Info = document.getElementById('cpu2-info');
            
            cpu1Info.innerHTML = `<h2 class="text-xl font-bold text-blue-900 mb-2" id="cpu1-name">${selectedCpu1.name}</h2><p class="text-blue-700" id="cpu1-cores">${selectedCpu1.core_count || 'Core count not available'}</p>`;
            cpu2Info.innerHTML = `<h2 class="text-xl font-bold text-indigo-900 mb-2" id="cpu2-name">${selectedCpu2.name}</h2><p class="text-indigo-700" id="cpu2-cores">${selectedCpu2.core_count || 'Core count not available'}</p>`;
            
            // Load benchmark data for both CPUs
            await loadBenchmarkComparison(selectedCpu1.id, selectedCpu2.id);
        }

        async function loadBenchmarkComparison(cpu1Id, cpu2Id) {
            try {
                const [cpu1Response, cpu2Response] = await Promise.all([
                    fetch(`/api/product/${cpu1Id}/results`),
                    fetch(`/api/product/${cpu2Id}/results`)
                ]);
                
                const cpu1Data = await cpu1Response.json();
                const cpu2Data = await cpu2Response.json();
                
                // Get all unique benchmarks
                const allBenchmarks = new Set();
                cpu1Data.results.forEach(r => allBenchmarks.add(r.benchmark_name));
                cpu2Data.results.forEach(r => allBenchmarks.add(r.benchmark_name));
                
                // Create lookup maps
                const cpu1Results = {};
                const cpu2Results = {};
                
                cpu1Data.results.forEach(r => {
                    cpu1Results[r.benchmark_name] = r;
                });
                
                cpu2Data.results.forEach(r => {
                    cpu2Results[r.benchmark_name] = r;
                });
                
                // Calculate and display overall performance comparison
                calculateOverallPerformance(cpu1Results, cpu2Results, Array.from(allBenchmarks));
                
                // Group benchmarks
                const groups = groupBenchmarks(Array.from(allBenchmarks), cpu1Results, cpu2Results);
                
                // Display comparison
                displayComparison(groups, cpu1Results, cpu2Results);
                
            } catch (error) {
                console.error('Error loading benchmark comparison:', error);
            }
        }

        function calculateOverallPerformance(cpu1Results, cpu2Results, allBenchmarks) {
            // Get benchmarks where both CPUs have data
            const commonBenchmarks = allBenchmarks.filter(name => 
                cpu1Results[name] && cpu2Results[name] && 
                cpu1Results[name].score && cpu2Results[name].score
            );
            
            if (commonBenchmarks.length === 0) {
                return; // No common benchmarks to compare
            }
            
            // Calculate individual percentage differences
            const percentageDifferences = [];
            
            commonBenchmarks.forEach(benchmarkName => {
                const cpu1Score = cpu1Results[benchmarkName].score;
                const cpu2Score = cpu2Results[benchmarkName].score;
                const benchmarkInfo = cpu1Results[benchmarkName] || cpu2Results[benchmarkName];
                
                // For CPU benchmarks, need to handle different unit types
                let cpu1Advantage, cpu2Advantage;
                
                if (benchmarkInfo.unit_type === 'seconds') {
                    // For time-based benchmarks, lower is better
                    cpu1Advantage = ((cpu2Score - cpu1Score) / cpu2Score) * 100; // CPU1 wins if it has lower time
                    cpu2Advantage = ((cpu1Score - cpu2Score) / cpu1Score) * 100; // CPU2 wins if it has lower time
                } else {
                    // For score/FPS benchmarks, higher is better
                    cpu1Advantage = ((cpu1Score - cpu2Score) / cpu2Score) * 100;
                    cpu2Advantage = ((cpu2Score - cpu1Score) / cpu1Score) * 100;
                }
                
                percentageDifferences.push({
                    cpu1Advantage: cpu1Advantage,
                    cpu2Advantage: cpu2Advantage
                });
            });
            
            // Calculate average percentage advantages
            const avgCpu1Advantage = percentageDifferences.reduce((sum, diff) => sum + diff.cpu1Advantage, 0) / percentageDifferences.length;
            const avgCpu2Advantage = percentageDifferences.reduce((sum, diff) => sum + diff.cpu2Advantage, 0) / percentageDifferences.length;
            
            // Determine which CPU is better overall and show indicator
            if (avgCpu1Advantage > avgCpu2Advantage && avgCpu1Advantage > 0) {
                // CPU 1 is better overall
                showOverallPerformanceIndicator('cpu1-info', avgCpu1Advantage, commonBenchmarks.length);
            } else if (avgCpu2Advantage > avgCpu1Advantage && avgCpu2Advantage > 0) {
                // CPU 2 is better overall
                showOverallPerformanceIndicator('cpu2-info', avgCpu2Advantage, commonBenchmarks.length);
            }
            // If they're equal or very close, show nothing
        }

        function showOverallPerformanceIndicator(containerId, percentage, benchmarkCount) {
            const container = document.getElementById(containerId);
            
            // Create overall performance indicator
            const indicatorDiv = document.createElement('div');
            indicatorDiv.className = 'mt-4 pt-4 border-t border-gray-300';
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'text-sm font-semibold text-gray-700 mb-2';
            titleDiv.textContent = `Overall Performance Advantage`;
            indicatorDiv.appendChild(titleDiv);
            
            const percentageDiv = document.createElement('div');
            percentageDiv.className = 'text-lg font-bold text-emerald-600 mb-2';
            percentageDiv.textContent = `+${percentage.toFixed(1)}% average`;
            indicatorDiv.appendChild(percentageDiv);
            
            // Progress bar
            const progressBarContainer = document.createElement('div');
            progressBarContainer.className = 'w-full h-3 bg-gray-200 rounded-full overflow-hidden mb-2';
            
            const progressBarFill = document.createElement('div');
            progressBarFill.className = 'h-full bg-emerald-500 rounded-full transition-all duration-1000 ease-out';
            progressBarFill.style.width = `${Math.min(percentage, 100)}%`;
            progressBarContainer.appendChild(progressBarFill);
            
            indicatorDiv.appendChild(progressBarContainer);
            
            const detailDiv = document.createElement('div');
            detailDiv.className = 'text-xs text-gray-500';
            detailDiv.textContent = `Based on ${benchmarkCount} common benchmarks`;
            indicatorDiv.appendChild(detailDiv);
            
            container.appendChild(indicatorDiv);
        }

        function groupBenchmarks(benchmarkNames, cpu1Results, cpu2Results) {
            const groups = {
                'Productivity': [],
                'Gaming': {}
            };
            
            benchmarkNames.forEach(name => {
                // Get benchmark details from either CPU (they should be the same)
                const benchmarkInfo = cpu1Results[name] || cpu2Results[name];
                
                if (benchmarkInfo && benchmarkInfo.resolution) {
                    // Gaming benchmark - group by game
                    const gameName = name.split(' CPU Performance')[0];
                    if (!groups['Gaming'][gameName]) {
                        groups['Gaming'][gameName] = [];
                    }
                    groups['Gaming'][gameName].push(name);
                } else {
                    // Productivity benchmark
                    groups['Productivity'].push(name);
                }
            });
            
            return groups;
        }

        function displayComparison(groups, cpu1Results, cpu2Results) {
            const container = document.getElementById('benchmark-groups');
            container.innerHTML = '';
            
            // Display Productivity benchmarks
            if (groups['Productivity'].length > 0) {
                const productivityDiv = createBenchmarkGroup('Productivity Benchmarks', groups['Productivity'], cpu1Results, cpu2Results);
                container.appendChild(productivityDiv);
            }
            
            // Display Gaming benchmarks grouped by game
            Object.keys(groups['Gaming']).forEach(gameName => {
                const gameDiv = createBenchmarkGroup(`${gameName} Gaming`, groups['Gaming'][gameName], cpu1Results, cpu2Results);
                container.appendChild(gameDiv);
            });
        }

        function createBenchmarkGroup(groupTitle, benchmarks, cpu1Results, cpu2Results) {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'bg-white rounded-lg shadow-sm overflow-hidden border border-gray-200';
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'bg-gray-800 text-white px-4 py-2 font-semibold text-base';
            titleDiv.textContent = groupTitle;
            groupDiv.appendChild(titleDiv);
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'divide-y divide-gray-100';
            
            benchmarks.forEach(benchmarkName => {
                const benchmarkDiv = createBenchmarkItem(benchmarkName, cpu1Results, cpu2Results);
                contentDiv.appendChild(benchmarkDiv);
            });
            
            groupDiv.appendChild(contentDiv);
            return groupDiv;
        }

        function createBenchmarkItem(benchmarkName, cpu1Results, cpu2Results) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'p-4';
            
            // Benchmark name
            const nameDiv = document.createElement('div');
            nameDiv.className = 'text-base font-medium text-gray-900 mb-3';
            const benchmarkInfo = cpu1Results[benchmarkName] || cpu2Results[benchmarkName];
            nameDiv.textContent = benchmarkName + (benchmarkInfo ? ` (${benchmarkInfo.unit_type})` : '');
            itemDiv.appendChild(nameDiv);
            
            // Results container
            const resultsDiv = document.createElement('div');
            resultsDiv.className = 'grid grid-cols-1 md:grid-cols-2 gap-3';
            
            // CPU 1 result
            const cpu1ResultDiv = createCPUResult(cpu1Results[benchmarkName], cpu2Results[benchmarkName], true);
            resultsDiv.appendChild(cpu1ResultDiv);
            
            // CPU 2 result
            const cpu2ResultDiv = createCPUResult(cpu2Results[benchmarkName], cpu1Results[benchmarkName], false);
            resultsDiv.appendChild(cpu2ResultDiv);
            
            itemDiv.appendChild(resultsDiv);
            return itemDiv;
        }

        function createCPUResult(currentResult, otherResult, isFirst) {
            const resultDiv = document.createElement('div');
            resultDiv.className = `p-3 rounded-md border ${isFirst ? 'bg-blue-50 border-blue-200' : 'bg-indigo-50 border-indigo-200'}`;
            
            if (currentResult) {
                // Calculate max score for proportional bars
                let maxScore = currentResult.score;
                if (otherResult && otherResult.score > maxScore) {
                    maxScore = otherResult.score;
                }
                
                // For time-based metrics (seconds), we want shorter bars to represent better performance
                // For other metrics (fps, points), longer bars represent better performance
                let barWidth;
                if (currentResult.unit_type === 'seconds') {
                    // For time: lower is better, so invert the scale
                    const maxTime = Math.max(currentResult.score, otherResult ? otherResult.score : currentResult.score) * 1.1;
                    barWidth = Math.max(100 - ((currentResult.score / maxTime) * 100), 20);
                } else {
                    // For scores/fps: higher is better
                    maxScore = maxScore * 1.1;
                    barWidth = Math.max((currentResult.score / maxScore) * 100, 20);
                }
                
                // Unit label above the bar
                const unitDiv = document.createElement('div');
                unitDiv.className = `text-xs font-medium ${isFirst ? 'text-blue-700' : 'text-indigo-700'} mb-1`;
                unitDiv.textContent = currentResult.unit_type;
                resultDiv.appendChild(unitDiv);
                
                // Score Bar Container
                const scoreContainer = document.createElement('div');
                scoreContainer.className = 'relative mb-2';
                
                const scoreBackground = document.createElement('div');
                scoreBackground.className = 'w-full h-6 bg-gray-200 rounded-md';
                scoreContainer.appendChild(scoreBackground);
                
                const scoreDiv = document.createElement('div');
                scoreDiv.className = `absolute top-0 left-0 h-6 ${isFirst ? 'bg-blue-500' : 'bg-indigo-500'} rounded-md flex items-center justify-end pr-2 text-white font-semibold text-xs transition-all duration-300`;
                scoreDiv.textContent = currentResult.score.toFixed(1);
                scoreDiv.style.width = `${barWidth}%`;
                scoreContainer.appendChild(scoreDiv);
                
                resultDiv.appendChild(scoreContainer);
                
                // Calculate performance increase (only show if this CPU is better)
                if (otherResult) {
                    const increase = calculatePerformanceIncrease(currentResult.score, otherResult.score, currentResult.unit_type);
                    if (increase.percentage > 0) {
                        const indicatorDiv = document.createElement('div');
                        indicatorDiv.className = 'space-y-0.5';
                        
                        const textDiv = document.createElement('div');
                        textDiv.className = 'text-xs font-semibold text-emerald-600';
                        textDiv.textContent = increase.text;
                        indicatorDiv.appendChild(textDiv);
                        
                        const barDiv = document.createElement('div');
                        barDiv.className = 'w-full h-1.5 bg-gray-200 rounded-full overflow-hidden';
                        
                        const fillDiv = document.createElement('div');
                        fillDiv.className = 'h-full bg-emerald-500 rounded-full transition-all duration-500';
                        fillDiv.style.width = `${Math.min(increase.percentage, 100)}%`;
                        barDiv.appendChild(fillDiv);
                        
                        indicatorDiv.appendChild(barDiv);
                        resultDiv.appendChild(indicatorDiv);
                    }
                }
            } else {
                // No data available
                const scoreContainer = document.createElement('div');
                scoreContainer.className = 'relative mb-3';
                
                const scoreBackground = document.createElement('div');
                scoreBackground.className = 'w-full h-8 bg-gray-200 rounded-md';
                scoreContainer.appendChild(scoreBackground);
                
                const scoreDiv = document.createElement('div');
                scoreDiv.className = 'absolute top-0 left-0 w-full h-8 bg-gray-400 rounded-md flex items-center justify-center text-white font-semibold text-sm';
                scoreDiv.textContent = 'N/A';
                scoreContainer.appendChild(scoreDiv);
                
                resultDiv.appendChild(scoreContainer);
                
                const unitDiv = document.createElement('div');
                unitDiv.className = 'text-sm text-gray-600';
                unitDiv.textContent = 'No data available';
                resultDiv.appendChild(unitDiv);
            }
            
            return resultDiv;
        }

        function calculatePerformanceIncrease(currentScore, otherScore, unitType) {
            if (currentScore === otherScore) {
                return { percentage: 0, text: '' };
            }
            
            let percentDiff;
            let isBetter;
            
            if (unitType === 'seconds') {
                // For time-based benchmarks, lower is better
                percentDiff = ((otherScore - currentScore) / otherScore) * 100;
                isBetter = currentScore < otherScore;
            } else {
                // For score/fps benchmarks, higher is better
                percentDiff = ((currentScore - otherScore) / otherScore) * 100;
                isBetter = currentScore > otherScore;
            }
            
            // Only return positive values (improvements)
            if (isBetter && percentDiff > 0) {
                const absPercent = Math.abs(percentDiff);
                return { 
                    percentage: absPercent, 
                    text: `${absPercent.toFixed(0)}% increase` 
                };
            }
            
            return { percentage: 0, text: '' };
        }

        // Tailwind handles all styling - no additional CSS needed
    </script>
</body>
</html>
