<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Benchmark Charts - Tech Benchmark Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ef4444',
                        secondary: '#f97316'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="text-center mb-8 relative">
            <a href="/" class="absolute left-0 top-1/2 transform -translate-y-1/2 bg-white hover:bg-gray-50 text-gray-700 px-4 py-2 rounded-lg border border-gray-300 hover:border-gray-400 transition-colors duration-200 flex items-center gap-2">
                ← Back
            </a>
            <h1 class="text-3xl font-bold text-gray-900 mb-2">📈 GPU Benchmark Charts</h1>
            <p class="text-lg text-gray-600">Browse all GPU benchmarks with interactive gaming performance charts</p>
        </div>
        
        <div class="bg-white rounded-lg border border-gray-200 p-6 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="flex flex-col">
                    <label for="resolution-filter" class="text-sm font-medium text-gray-700 mb-2">Resolution</label>
                    <select id="resolution-filter" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-white">
                        <option value="">All Resolutions</option>
                        <option value="1080p">1080p</option>
                        <option value="1440p">1440p</option>
                        <option value="4K">4K</option>
                    </select>
                </div>
                <div class="flex flex-col">
                    <label for="game-filter" class="text-sm font-medium text-gray-700 mb-2">Game</label>
                    <select id="game-filter" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-white">
                        <option value="">All Games</option>
                    </select>
                </div>
                <div class="flex flex-col">
                    <label for="sort-filter" class="text-sm font-medium text-gray-700 mb-2">Sort By</label>
                    <select id="sort-filter" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-white">
                        <option value="name">Name</option>
                        <option value="results">Result Count</option>
                    </select>
                </div>
                <div class="flex flex-col">
                    <label class="text-sm font-medium text-gray-700 mb-2">Display Data</label>
                    <div class="flex gap-2">
                        <button id="avg-fps-btn" class="flex-1 px-3 py-2 border border-primary text-primary bg-primary text-white rounded-md hover:bg-red-600 hover:border-red-600 transition-colors duration-200 text-sm font-medium">Avg FPS</button>
                        <button id="low-fps-btn" class="flex-1 px-3 py-2 border border-primary text-primary rounded-md hover:bg-primary hover:text-white transition-colors duration-200 text-sm font-medium">1% Low</button>
                        <button id="both-fps-btn" class="flex-1 px-3 py-2 border border-primary text-primary rounded-md hover:bg-primary hover:text-white transition-colors duration-200 text-sm font-medium">Both</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="charts-section">
            <div id="loading" class="flex items-center justify-center py-16">
                <div class="text-center">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-primary mb-4"></div>
                    <p class="text-gray-600">Loading GPU benchmarks...</p>
                </div>
            </div>
            
            <div id="charts-container"></div>
        </div>
    </div>

    <script>
        let allBenchmarks = [];
        let chartInstances = [];
        let currentDataMode = 'avg'; // 'avg', 'low', 'both'
        let chartObserver;
        
        // Load benchmarks on page load
        window.onload = function() {
            loadBenchmarks();
            setupFilters();
            setupChartObserver();
        };

        function setupChartObserver() {
            // Create intersection observer to handle chart visibility
            chartObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const canvas = entry.target.querySelector('canvas');
                        if (canvas) {
                            const chartId = canvas.id;
                            const chart = chartInstances.find(c => c.canvas.id === chartId);
                            if (chart) {
                                // Force chart resize when it becomes visible
                                setTimeout(() => {
                                    chart.resize();
                                    chart.update('none');
                                }, 100);
                            }
                        }
                    }
                });
            }, {
                threshold: 0.1,
                rootMargin: '50px'
            });
        }

        function setupFilters() {
            const resolutionFilter = document.getElementById('resolution-filter');
            const gameFilter = document.getElementById('game-filter');
            const sortFilter = document.getElementById('sort-filter');
            
            [resolutionFilter, gameFilter, sortFilter].forEach(filter => {
                filter.addEventListener('change', filterAndDisplayBenchmarks);
            });
            
            // Data toggle buttons
            document.getElementById('avg-fps-btn').addEventListener('click', () => setDataMode('avg'));
            document.getElementById('low-fps-btn').addEventListener('click', () => setDataMode('low'));
            document.getElementById('both-fps-btn').addEventListener('click', () => setDataMode('both'));
        }

        function setDataMode(mode) {
            currentDataMode = mode;
            
            // Update button states - remove active styles from all buttons
            document.querySelectorAll('#avg-fps-btn, #low-fps-btn, #both-fps-btn').forEach(btn => {
                btn.classList.remove('bg-primary', 'text-white');
                btn.classList.add('text-primary');
            });
            
            // Add active styles to selected button
            const activeBtn = document.getElementById(`${mode === 'avg' ? 'avg-fps' : mode === 'low' ? 'low-fps' : 'both-fps'}-btn`);
            activeBtn.classList.add('bg-primary', 'text-white');
            activeBtn.classList.remove('text-primary');
            
            // Refresh charts
            filterAndDisplayBenchmarks();
        }

        async function loadBenchmarks() {
            try {
                const response = await fetch('/api/benchmarks/grouped?type=GPU');
                const data = await response.json();
                
                // GPU benchmarks should only be gaming benchmarks
                allBenchmarks = Object.values(data.gaming).flat();
                
                // Populate game filter
                const games = [...new Set(Object.keys(data.gaming))];
                const gameFilter = document.getElementById('game-filter');
                games.forEach(game => {
                    const option = new Option(game, game);
                    gameFilter.add(option);
                });
                
                document.getElementById('loading').style.display = 'none';
                filterAndDisplayBenchmarks();
                
            } catch (error) {
                console.error('Error loading benchmarks:', error);
                document.getElementById('loading').textContent = 'Error loading benchmarks';
            }
        }

        function filterAndDisplayBenchmarks() {
            const resolutionFilter = document.getElementById('resolution-filter').value;
            const gameFilter = document.getElementById('game-filter').value;
            const sortFilter = document.getElementById('sort-filter').value;
            
            let filtered = allBenchmarks.filter(benchmark => {
                if (resolutionFilter && benchmark.resolution !== resolutionFilter) return false;
                if (gameFilter && !benchmark.name.toLowerCase().includes(gameFilter.toLowerCase())) return false;
                return true;
            });
            
            // Sort benchmarks
            filtered.sort((a, b) => {
                if (sortFilter === 'results') {
                    return b.result_count - a.result_count;
                } else {
                    return a.name.localeCompare(b.name);
                }
            });
            
            displayBenchmarks(filtered);
        }

        function displayBenchmarks(benchmarks) {
            // Clear existing charts
            chartInstances.forEach(chart => chart.destroy());
            chartInstances = [];
            
            // Disconnect previous observers
            if (chartObserver) {
                chartObserver.disconnect();
                setupChartObserver();
            }
            
            const container = document.getElementById('charts-container');
            container.innerHTML = '';
            
            if (benchmarks.length === 0) {
                container.innerHTML = '<div class="text-center py-16 text-gray-500">No benchmarks match the selected filters</div>';
                return;
            }
            
            // Group benchmarks by game and resolution
            const groups = groupBenchmarks(benchmarks);
            
            // Create chart groups
            Object.keys(groups).forEach(groupName => {
                const groupDiv = createBenchmarkGroup(groupName, groups[groupName]);
                container.appendChild(groupDiv);
            });
        }

        function groupBenchmarks(benchmarks) {
            const groups = {};
            
            benchmarks.forEach(benchmark => {
                // Extract game name
                let gameName = benchmark.name;
                
                // Remove common suffixes to get clean game name
                const suffixes = [' Ultra', ' Max', ' High', ' Maximum', ' RT', ' FSR'];
                for (const suffix of suffixes) {
                    if (gameName.includes(suffix)) {
                        gameName = gameName.split(suffix)[0];
                        break;
                    }
                }
                
                const groupKey = `${gameName} - ${benchmark.resolution}`;
                
                if (!groups[groupKey]) {
                    groups[groupKey] = [];
                }
                groups[groupKey].push(benchmark);
            });
            
            return groups;
        }

        function createBenchmarkGroup(groupName, benchmarks) {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'mb-12';
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'text-2xl font-bold text-gray-900 mb-6 pb-2 border-b-2 border-primary';
            titleDiv.textContent = groupName;
            groupDiv.appendChild(titleDiv);
            
            const chartsGrid = document.createElement('div');
            chartsGrid.className = 'grid grid-cols-1 lg:grid-cols-2 gap-8';
            
            benchmarks.forEach(benchmark => {
                const chartContainer = createChartContainer(benchmark);
                chartsGrid.appendChild(chartContainer);
            });
            
            groupDiv.appendChild(chartsGrid);
            return groupDiv;
        }

        function createChartContainer(benchmark) {
            const container = document.createElement('div');
            container.className = 'bg-white rounded-lg border border-gray-200 overflow-hidden';
            
            const header = document.createElement('div');
            header.className = 'p-6 border-b border-gray-200';
            
            const title = document.createElement('div');
            title.className = 'text-xl font-semibold text-gray-900 mb-2';
            title.textContent = benchmark.name;
            
            const description = document.createElement('div');
            description.className = 'text-gray-600 mb-2';
            description.textContent = benchmark.description || 'GPU gaming performance benchmark';
            
            const unit = document.createElement('div');
            unit.className = 'text-sm text-gray-500';
            unit.textContent = `${benchmark.resolution} gaming performance in FPS`;
            
            header.appendChild(title);
            header.appendChild(description);
            header.appendChild(unit);
            
            const canvasContainer = document.createElement('div');
            canvasContainer.className = 'p-6';
            canvasContainer.style.height = '400px';
            
            const canvas = document.createElement('canvas');
            canvas.id = `chart-${benchmark.id}`;
            canvasContainer.appendChild(canvas);
            
            container.appendChild(header);
            container.appendChild(canvasContainer);
            
            // Load chart data
            loadChartData(benchmark.id, canvas);
            
            return container;
        }

        async function loadChartData(benchmarkId, canvas) {
            try {
                const response = await fetch(`/api/benchmark/${benchmarkId}/chart-data`);
                const data = await response.json();
                
                if (data.labels.length === 0) {
                    canvas.parentElement.innerHTML = '<div class="flex items-center justify-center h-64 text-gray-500">No data available for this benchmark</div>';
                    return;
                }
                
                createChart(canvas, data);
                
            } catch (error) {
                console.error('Error loading chart data:', error);
                canvas.parentElement.innerHTML = '<div class="flex items-center justify-center h-64 text-red-500">Error loading chart data</div>';
            }
        }

        function createChart(canvas, data) {
            // Limit to top 15 results for readability
            const maxResults = 15;
            const labels = data.labels.slice(0, maxResults);
            const avgData = data.data.slice(0, maxResults);
            const lowData = data.low_data.slice(0, maxResults);
            const colors = data.colors.slice(0, maxResults);
            
            const datasets = [];
            
            if (currentDataMode === 'avg' || currentDataMode === 'both') {
                datasets.push({
                    label: 'Average FPS',
                    data: avgData,
                    backgroundColor: currentDataMode === 'both' ? colors.map(c => c + '80') : colors,
                    borderColor: colors,
                    borderWidth: 1
                });
            }
            
            if (currentDataMode === 'low' || currentDataMode === 'both') {
                datasets.push({
                    label: '1% Low FPS',
                    data: lowData,
                    backgroundColor: currentDataMode === 'both' ? colors.map(c => c + '40') : colors,
                    borderColor: colors,
                    borderWidth: 1
                });
            }
            
            const chart = new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    indexAxis: 'y', // This makes it horizontal
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        onComplete: function() {
                            // Ensure proper sizing after animation
                            this.resize();
                        }
                    },
                    plugins: {
                        legend: {
                            display: currentDataMode === 'both'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed.x;
                                    return `${context.dataset.label}: ${value ? value.toFixed(1) : 'N/A'} FPS`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'FPS'
                            }
                        },
                        y: {
                            // Product names on the left - no rotation needed
                        }
                    },
                    layout: {
                        padding: {
                            top: 10,
                            bottom: 10
                        }
                    }
                }
            });
            
            chartInstances.push(chart);
            
            // Start observing the chart container for visibility changes
            if (chartObserver) {
                chartObserver.observe(canvas.closest('.bg-white'));
            }
        }
    </script>
</body>
</html>
