<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Comparison - Tech Benchmark Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#6366f1'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-4">
        <div class="text-center mb-4 relative">
            <a href="/" class="absolute left-0 top-1/2 transform -translate-y-1/2 bg-white hover:bg-gray-50 text-gray-700 px-3 py-1.5 rounded-lg border border-gray-300 hover:border-gray-400 transition-colors duration-200 flex items-center gap-2 text-sm">
                ← Back
            </a>
            <h1 class="text-2xl font-bold text-gray-900 mb-1">🎮 GPU Comparison</h1>
            <p class="text-base text-gray-600">Compare two GPUs across all available gaming benchmarks</p>
        </div>
        
        <div class="bg-white rounded-lg shadow-sm p-4 mb-4 border border-gray-200">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                <div class="space-y-2">
                    <h3 class="text-base font-semibold text-gray-900">GPU 1</h3>
                    <div class="relative">
                        <input type="text" id="gpu1-input" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 focus:border-transparent bg-white text-gray-900 placeholder-gray-500 text-sm" placeholder="Type to search GPUs..." readonly>
                        <div id="gpu1-list" class="absolute z-50 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-48 overflow-y-auto hidden"></div>
                    </div>
                </div>
                
                <div class="text-center">
                    <div class="bg-red-100 text-red-800 font-bold text-lg px-4 py-2 rounded-full inline-block">VS</div>
                </div>
                
                <div class="space-y-2">
                    <h3 class="text-base font-semibold text-gray-900">GPU 2</h3>
                    <div class="relative">
                        <input type="text" id="gpu2-input" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-orange-500 focus:border-transparent bg-white text-gray-900 placeholder-gray-500 text-sm" placeholder="Type to search GPUs..." readonly>
                        <div id="gpu2-list" class="absolute z-50 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-48 overflow-y-auto hidden"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="space-y-4">
            <div id="no-selection" class="bg-white rounded-lg shadow-sm p-8 text-center border border-gray-200">
                <div class="text-gray-400 text-4xl mb-3">🎮</div>
                <h3 class="text-lg font-semibold text-gray-900 mb-1">Select GPUs to Compare</h3>
                <p class="text-sm text-gray-600">Choose two GPUs above to see their detailed gaming benchmark comparison</p>
            </div>
            
            <div id="comparison-results" style="display: none;">
                <div class="bg-white rounded-lg shadow-sm p-4 mb-4 border border-gray-200">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="text-center p-3 bg-red-50 rounded-md border border-red-200" id="gpu1-info">
                            <h2 class="text-lg font-bold text-red-900 mb-1" id="gpu1-name">-</h2>
                        </div>
                        <div class="text-center p-3 bg-orange-50 rounded-md border border-orange-200" id="gpu2-info">
                            <h2 class="text-lg font-bold text-orange-900 mb-1" id="gpu2-name">-</h2>
                        </div>
                    </div>
                </div>
                
                <div id="benchmark-groups" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        let gpuData = {};
        let allGpus = [];
        let selectedGpu1 = null;
        let selectedGpu2 = null;
        
        // Load GPUs on page load
        window.onload = function() {
            loadGPUs();
        };

        async function loadGPUs() {
            try {
                const response = await fetch('/api/products?type=GPU');
                const gpus = await response.json();
                
                allGpus = gpus;
                
                // Store GPU data for later use
                gpus.forEach(gpu => {
                    gpuData[gpu.id] = gpu;
                });
                
                // Setup searchable dropdowns
                setupSearchableDropdown('gpu1', gpus, (gpu) => {
                    selectedGpu1 = gpu;
                    updateComparison();
                });
                
                setupSearchableDropdown('gpu2', gpus, (gpu) => {
                    selectedGpu2 = gpu;
                    updateComparison();
                });
                
            } catch (error) {
                console.error('Error loading GPUs:', error);
            }
        }

        function setupSearchableDropdown(id, items, onSelect) {
            const input = document.getElementById(`${id}-input`);
            const list = document.getElementById(`${id}-list`);
            
            // Make input editable when clicked
            input.addEventListener('click', () => {
                input.removeAttribute('readonly');
                input.focus();
                showDropdown(list, items, input, onSelect, id);
            });
            
            // Handle typing
            input.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                const filtered = items.filter(item => 
                    item.name.toLowerCase().includes(query)
                );
                showDropdown(list, filtered, input, onSelect, id);
            });
            
            // Handle focus out
            input.addEventListener('blur', (e) => {
                // Delay hiding to allow for item clicks
                setTimeout(() => {
                    if (!list.contains(document.activeElement)) {
                        hideDropdown(list);
                        if (!getSelectedValue(id)) {
                            input.value = '';
                            input.setAttribute('readonly', 'readonly');
                        }
                    }
                }, 150);
            });
            
            // Handle keyboard navigation
            input.addEventListener('keydown', (e) => {
                const items = list.querySelectorAll('.dropdown-item');
                const current = list.querySelector('.dropdown-item.highlighted');
                
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    const next = current ? current.nextElementSibling : items[0];
                    if (next) highlightItem(next);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    const prev = current ? current.previousElementSibling : items[items.length - 1];
                    if (prev) highlightItem(prev);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (current) {
                        current.click();
                    }
                } else if (e.key === 'Escape') {
                    hideDropdown(list);
                    input.blur();
                }
            });
        }

        function showDropdown(list, items, input, onSelect, id) {
            list.innerHTML = '';
            list.classList.remove('hidden');
            
            if (items.length === 0) {
                const noResults = document.createElement('div');
                noResults.className = 'px-4 py-3 text-gray-500 text-sm';
                noResults.textContent = 'No GPUs found';
                list.appendChild(noResults);
                return;
            }
            
            items.slice(0, 20).forEach((item, index) => { // Limit to 20 results
                const div = document.createElement('div');
                div.className = 'px-3 py-2 cursor-pointer text-gray-900 hover:bg-red-50 hover:text-red-900 transition-colors duration-150 border-b border-gray-100 last:border-b-0 text-sm';
                div.textContent = item.name;
                div.addEventListener('click', () => {
                    selectItem(input, item, onSelect, id);
                    hideDropdown(list);
                });
                list.appendChild(div);
                
                if (index === 0) highlightItem(div);
            });
        }

        function hideDropdown(list) {
            list.classList.add('hidden');
        }

        function highlightItem(item) {
            // Remove previous highlight
            const prev = item.parentElement.querySelector('.highlighted');
            if (prev) {
                prev.classList.remove('highlighted', 'bg-red-500', 'text-white');
                prev.classList.add('hover:bg-red-50', 'hover:text-red-900');
            }
            
            // Add highlight
            item.classList.add('highlighted', 'bg-red-500', 'text-white');
            item.classList.remove('hover:bg-red-50', 'hover:text-red-900');
        }

        function selectItem(input, item, onSelect, id) {
            input.value = item.name;
            input.setAttribute('readonly', 'readonly');
            setSelectedValue(id, item.id);
            onSelect(item);
        }

        function getSelectedValue(id) {
            return id === 'gpu1' ? selectedGpu1?.id : selectedGpu2?.id;
        }

        function setSelectedValue(id, value) {
            if (id === 'gpu1') {
                selectedGpu1 = value ? gpuData[value] : null;
            } else {
                selectedGpu2 = value ? gpuData[value] : null;
            }
        }

        async function updateComparison() {
            if (!selectedGpu1 || !selectedGpu2) {
                document.getElementById('no-selection').style.display = 'block';
                document.getElementById('comparison-results').style.display = 'none';
                return;
            }
            
            document.getElementById('no-selection').style.display = 'none';
            document.getElementById('comparison-results').style.display = 'block';
            
            // Update GPU info
            document.getElementById('gpu1-name').textContent = selectedGpu1.name;
            document.getElementById('gpu2-name').textContent = selectedGpu2.name;
            
            // Clear any existing overall performance indicators
            document.getElementById('gpu1-info').innerHTML = `<h2 class="text-xl font-bold text-red-900 mb-2" id="gpu1-name">${selectedGpu1.name}</h2>`;
            document.getElementById('gpu2-info').innerHTML = `<h2 class="text-xl font-bold text-orange-900 mb-2" id="gpu2-name">${selectedGpu2.name}</h2>`;
            
            // Load benchmark data for both GPUs
            await loadBenchmarkComparison(selectedGpu1.id, selectedGpu2.id);
        }

        async function loadBenchmarkComparison(gpu1Id, gpu2Id) {
            try {
                const [gpu1Response, gpu2Response] = await Promise.all([
                    fetch(`/api/product/${gpu1Id}/results`),
                    fetch(`/api/product/${gpu2Id}/results`)
                ]);
                
                const gpu1Data = await gpu1Response.json();
                const gpu2Data = await gpu2Response.json();
                
                // Get all unique benchmarks
                const allBenchmarks = new Set();
                gpu1Data.results.forEach(r => allBenchmarks.add(r.benchmark_name));
                gpu2Data.results.forEach(r => allBenchmarks.add(r.benchmark_name));
                
                // Create lookup maps
                const gpu1Results = {};
                const gpu2Results = {};
                
                gpu1Data.results.forEach(r => {
                    gpu1Results[r.benchmark_name] = r;
                });
                
                gpu2Data.results.forEach(r => {
                    gpu2Results[r.benchmark_name] = r;
                });
                
                // Group benchmarks by game and resolution
                const groups = groupBenchmarks(Array.from(allBenchmarks), gpu1Results, gpu2Results);
                
                // Calculate and display overall performance comparison
                calculateOverallPerformance(gpu1Results, gpu2Results, Array.from(allBenchmarks));
                
                // Display comparison
                displayComparison(groups, gpu1Results, gpu2Results);
                
            } catch (error) {
                console.error('Error loading benchmark comparison:', error);
            }
        }

        function calculateOverallPerformance(gpu1Results, gpu2Results, allBenchmarks) {
            // Get benchmarks where both GPUs have data
            const commonBenchmarks = allBenchmarks.filter(name => 
                gpu1Results[name] && gpu2Results[name] && 
                gpu1Results[name].score && gpu2Results[name].score
            );
            
            if (commonBenchmarks.length === 0) {
                return; // No common benchmarks to compare
            }
            
            // Calculate individual percentage differences
            const percentageDifferences = [];
            
            commonBenchmarks.forEach(benchmarkName => {
                const gpu1Score = gpu1Results[benchmarkName].score;
                const gpu2Score = gpu2Results[benchmarkName].score;
                
                // Calculate percentage difference for each benchmark
                const gpu1VsGpu2 = ((gpu1Score - gpu2Score) / gpu2Score) * 100;
                const gpu2VsGpu1 = ((gpu2Score - gpu1Score) / gpu1Score) * 100;
                
                percentageDifferences.push({
                    gpu1Advantage: gpu1VsGpu2,
                    gpu2Advantage: gpu2VsGpu1
                });
            });
            
            // Calculate average percentage advantages
            const avgGpu1Advantage = percentageDifferences.reduce((sum, diff) => sum + diff.gpu1Advantage, 0) / percentageDifferences.length;
            const avgGpu2Advantage = percentageDifferences.reduce((sum, diff) => sum + diff.gpu2Advantage, 0) / percentageDifferences.length;
            
            // Determine which GPU is better overall and show indicator
            if (avgGpu1Advantage > avgGpu2Advantage) {
                // GPU 1 is better overall
                showOverallPerformanceIndicator('gpu1-info', avgGpu1Advantage, commonBenchmarks.length);
            } else if (avgGpu2Advantage > avgGpu1Advantage) {
                // GPU 2 is better overall
                showOverallPerformanceIndicator('gpu2-info', avgGpu2Advantage, commonBenchmarks.length);
            }
            // If they're equal, show nothing
        }

        function showOverallPerformanceIndicator(containerId, percentage, benchmarkCount) {
            const container = document.getElementById(containerId);
            
            // Create overall performance indicator
            const indicatorDiv = document.createElement('div');
            indicatorDiv.className = 'mt-4 pt-4 border-t border-gray-300';
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'text-sm font-semibold text-gray-700 mb-2';
            titleDiv.textContent = `Overall Performance Advantage`;
            indicatorDiv.appendChild(titleDiv);
            
            const percentageDiv = document.createElement('div');
            percentageDiv.className = 'text-lg font-bold text-emerald-600 mb-2';
            percentageDiv.textContent = `+${percentage.toFixed(1)}% average`;
            indicatorDiv.appendChild(percentageDiv);
            
            // Progress bar
            const progressBarContainer = document.createElement('div');
            progressBarContainer.className = 'w-full h-3 bg-gray-200 rounded-full overflow-hidden mb-2';
            
            const progressBarFill = document.createElement('div');
            progressBarFill.className = 'h-full bg-emerald-500 rounded-full transition-all duration-1000 ease-out';
            progressBarFill.style.width = `${Math.min(percentage, 100)}%`;
            progressBarContainer.appendChild(progressBarFill);
            
            indicatorDiv.appendChild(progressBarContainer);
            
            const detailDiv = document.createElement('div');
            detailDiv.className = 'text-xs text-gray-500';
            detailDiv.textContent = `Based on ${benchmarkCount} common benchmarks`;
            indicatorDiv.appendChild(detailDiv);
            
            container.appendChild(indicatorDiv);
        }

        function groupBenchmarks(benchmarkNames, gpu1Results, gpu2Results) {
            const groups = {};
            
            benchmarkNames.forEach(name => {
                // Get benchmark details from either GPU
                const benchmarkInfo = gpu1Results[name] || gpu2Results[name];
                
                if (benchmarkInfo && benchmarkInfo.resolution) {
                    // Extract game name (remove resolution and settings)
                    let gameName = name;
                    
                    // Common patterns to extract game names
                    if (name.includes('Ultra')) {
                        gameName = name.split(' Ultra')[0];
                    } else if (name.includes('Max')) {
                        gameName = name.split(' Max')[0];
                    } else if (name.includes('High')) {
                        gameName = name.split(' High')[0];
                    } else if (name.includes('Maximum')) {
                        gameName = name.split(' Maximum')[0];
                    }
                    
                    if (!groups[gameName]) {
                        groups[gameName] = {};
                    }
                    
                    const resolution = benchmarkInfo.resolution;
                    if (!groups[gameName][resolution]) {
                        groups[gameName][resolution] = [];
                    }
                    
                    groups[gameName][resolution].push(name);
                }
            });
            
            return groups;
        }

        function displayComparison(groups, gpu1Results, gpu2Results) {
            const container = document.getElementById('benchmark-groups');
            container.innerHTML = '';
            
            // Sort games alphabetically
            const sortedGames = Object.keys(groups).sort();
            
            sortedGames.forEach(gameName => {
                // Sort resolutions: 1080p, 1440p, 4K
                const resolutions = Object.keys(groups[gameName]).sort((a, b) => {
                    const order = { '1080p': 1, '1440p': 2, '4K': 3 };
                    return (order[a] || 999) - (order[b] || 999);
                });
                
                resolutions.forEach(resolution => {
                    const groupTitle = `${gameName} - ${resolution}`;
                    const benchmarks = groups[gameName][resolution];
                    const gameDiv = createBenchmarkGroup(groupTitle, benchmarks, gpu1Results, gpu2Results);
                    container.appendChild(gameDiv);
                });
            });
        }

        function createBenchmarkGroup(groupTitle, benchmarks, gpu1Results, gpu2Results) {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'bg-white rounded-lg shadow-sm overflow-hidden border border-gray-200';
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'bg-gray-800 text-white px-4 py-2 font-semibold text-base';
            titleDiv.textContent = groupTitle;
            groupDiv.appendChild(titleDiv);
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'divide-y divide-gray-100';
            
            benchmarks.forEach(benchmarkName => {
                const benchmarkDiv = createBenchmarkItem(benchmarkName, gpu1Results, gpu2Results);
                contentDiv.appendChild(benchmarkDiv);
            });
            
            groupDiv.appendChild(contentDiv);
            return groupDiv;
        }

        function createBenchmarkItem(benchmarkName, gpu1Results, gpu2Results) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'p-4';
            
            // Benchmark name
            const nameDiv = document.createElement('div');
            nameDiv.className = 'text-base font-medium text-gray-900 mb-3';
            const benchmarkInfo = gpu1Results[benchmarkName] || gpu2Results[benchmarkName];
            nameDiv.textContent = benchmarkName;
            itemDiv.appendChild(nameDiv);
            
            // Results container
            const resultsDiv = document.createElement('div');
            resultsDiv.className = 'grid grid-cols-1 md:grid-cols-2 gap-3';
            
            // GPU 1 result
            const gpu1ResultDiv = createGPUResult(gpu1Results[benchmarkName], gpu2Results[benchmarkName], true);
            resultsDiv.appendChild(gpu1ResultDiv);
            
            // GPU 2 result
            const gpu2ResultDiv = createGPUResult(gpu2Results[benchmarkName], gpu1Results[benchmarkName], false);
            resultsDiv.appendChild(gpu2ResultDiv);
            
            itemDiv.appendChild(resultsDiv);
            return itemDiv;
        }

        function createGPUResult(currentResult, otherResult, isFirst) {
            const resultDiv = document.createElement('div');
            resultDiv.className = `p-3 rounded-md border ${isFirst ? 'bg-red-50 border-red-200' : 'bg-orange-50 border-orange-200'}`;
            
            if (currentResult) {
                // Calculate max score for proportional bars (compare with other result)
                let maxScore = currentResult.score;
                if (otherResult && otherResult.score > maxScore) {
                    maxScore = otherResult.score;
                }
                // Add some padding to max score for better visualization
                maxScore = maxScore * 1.1;
                
                // Average FPS Label (above bars)
                const avgFpsLabel = document.createElement('div');
                avgFpsLabel.className = `text-xs font-medium ${isFirst ? 'text-red-700' : 'text-orange-700'} mb-1`;
                avgFpsLabel.textContent = 'Average FPS';
                resultDiv.appendChild(avgFpsLabel);
                
                // Average FPS Bar (top bar)
                const avgFpsContainer = document.createElement('div');
                avgFpsContainer.className = 'relative';
                
                const avgFpsBackground = document.createElement('div');
                avgFpsBackground.className = 'w-full h-6 bg-gray-200 rounded-t-md';
                avgFpsContainer.appendChild(avgFpsBackground);
                
                const avgFpsDiv = document.createElement('div');
                avgFpsDiv.className = `absolute top-0 left-0 h-6 ${isFirst ? 'bg-red-500' : 'bg-orange-500'} rounded-t-md flex items-center justify-end pr-2 text-white font-semibold text-xs transition-all duration-300`;
                avgFpsDiv.textContent = currentResult.score.toFixed(1);
                const avgFpsWidth = Math.max((currentResult.score / maxScore) * 100, 20);
                avgFpsDiv.style.width = `${avgFpsWidth}%`;
                avgFpsContainer.appendChild(avgFpsDiv);
                
                resultDiv.appendChild(avgFpsContainer);
                
                // 1% Low FPS Bar (bottom bar, touching the top bar)
                if (currentResult.score_1_percent_low) {
                    const lowFpsContainer = document.createElement('div');
                    lowFpsContainer.className = 'relative';
                    
                    const lowFpsBackground = document.createElement('div');
                    lowFpsBackground.className = 'w-full h-6 bg-gray-200 rounded-b-md';
                    lowFpsContainer.appendChild(lowFpsBackground);
                    
                    const lowFpsDiv = document.createElement('div');
                    lowFpsDiv.className = `absolute top-0 left-0 h-6 ${isFirst ? 'bg-red-400' : 'bg-orange-400'} rounded-b-md flex items-center justify-end pr-2 text-white font-semibold text-xs transition-all duration-300`;
                    lowFpsDiv.textContent = currentResult.score_1_percent_low.toFixed(1);
                    const lowFpsWidth = Math.max((currentResult.score_1_percent_low / maxScore) * 100, 18);
                    lowFpsDiv.style.width = `${lowFpsWidth}%`;
                    lowFpsContainer.appendChild(lowFpsDiv);
                    
                    resultDiv.appendChild(lowFpsContainer);
                    
                    // 1% Low FPS Label (below bars)
                    const lowFpsLabel = document.createElement('div');
                    lowFpsLabel.className = `text-xs font-medium ${isFirst ? 'text-red-700' : 'text-orange-700'} mt-1 mb-3`;
                    lowFpsLabel.textContent = '1% Low FPS';
                    resultDiv.appendChild(lowFpsLabel);
                } else {
                    // If no 1% low data, round the bottom of the average FPS bar
                    avgFpsBackground.className = 'w-full h-6 bg-gray-200 rounded-md';
                    avgFpsDiv.className = `absolute top-0 left-0 h-6 ${isFirst ? 'bg-red-500' : 'bg-orange-500'} rounded-md flex items-center justify-end pr-2 text-white font-semibold text-xs transition-all duration-300`;
                    
                    // Add spacing
                    const spacer = document.createElement('div');
                    spacer.className = 'mb-3';
                    resultDiv.appendChild(spacer);
                }
                
                // Calculate performance increase (only show if this GPU is better)
                if (otherResult) {
                    const increase = calculatePerformanceIncrease(currentResult.score, otherResult.score);
                    if (increase.percentage > 0) {
                        const indicatorDiv = document.createElement('div');
                        indicatorDiv.className = 'space-y-0.5';
                        
                        const textDiv = document.createElement('div');
                        textDiv.className = 'text-xs font-semibold text-emerald-600';
                        textDiv.textContent = increase.text;
                        indicatorDiv.appendChild(textDiv);
                        
                        const barDiv = document.createElement('div');
                        barDiv.className = 'w-full h-1.5 bg-gray-200 rounded-full overflow-hidden';
                        
                        const fillDiv = document.createElement('div');
                        fillDiv.className = 'h-full bg-emerald-500 rounded-full transition-all duration-500';
                        fillDiv.style.width = `${Math.min(increase.percentage, 100)}%`;
                        barDiv.appendChild(fillDiv);
                        
                        indicatorDiv.appendChild(barDiv);
                        resultDiv.appendChild(indicatorDiv);
                    }
                }
            } else {
                // No data available
                const unitDiv = document.createElement('div');
                unitDiv.className = 'text-sm text-gray-600 mb-2';
                unitDiv.textContent = 'No data available';
                resultDiv.appendChild(unitDiv);
                
                const scoreContainer = document.createElement('div');
                scoreContainer.className = 'relative mb-3';
                
                const scoreBackground = document.createElement('div');
                scoreBackground.className = 'w-full h-8 bg-gray-200 rounded-md';
                scoreContainer.appendChild(scoreBackground);
                
                const scoreDiv = document.createElement('div');
                scoreDiv.className = 'absolute top-0 left-0 w-full h-8 bg-gray-400 rounded-md flex items-center justify-center text-white font-semibold text-sm';
                scoreDiv.textContent = 'N/A';
                scoreContainer.appendChild(scoreDiv);
                
                resultDiv.appendChild(scoreContainer);
            }
            
            return resultDiv;
        }

        function calculatePerformanceIncrease(currentScore, otherScore) {
            if (currentScore === otherScore) {
                return { percentage: 0, text: '' };
            }
            
            // For FPS, higher is better
            const percentDiff = ((currentScore - otherScore) / otherScore) * 100;
            
            // Only return positive values (improvements)
            if (currentScore > otherScore && percentDiff > 0) {
                const absPercent = Math.abs(percentDiff);
                return { 
                    percentage: absPercent, 
                    text: `${absPercent.toFixed(0)}% increase` 
                };
            }
            
            return { percentage: 0, text: '' };
        }

        // Tailwind handles all styling - no additional CSS needed
    </script>
</body>
</html>
