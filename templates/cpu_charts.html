<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Benchmark Charts - Tech Benchmark Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }
        
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
        }
        
        .back-btn {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        
        .filter-section {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
        }
        
        .filter-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .filter-group label {
            font-weight: bold;
            color: #333;
            font-size: 0.9em;
        }
        
        .filter-select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
            font-size: 0.9em;
        }
        
        .charts-section {
            padding: 30px;
        }
        
        .loading {
            text-align: center;
            color: #666;
            font-size: 1.1em;
            margin: 50px 0;
        }
        
        .benchmark-group {
            margin-bottom: 50px;
        }
        
        .group-title {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 10px 10px 0 0;
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 0;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 0 0 10px 10px;
        }
        
        .chart-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .chart-header {
            margin-bottom: 15px;
            text-align: center;
        }
        
        .chart-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .chart-description {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .chart-unit {
            font-size: 0.8em;
            color: #888;
            font-style: italic;
        }
        
        .chart-canvas {
            position: relative;
            height: 400px;
        }
        
        .no-data {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 40px;
        }
        
        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
                padding: 20px;
            }
            
            .chart-container {
                padding: 15px;
            }
            
            .chart-canvas {
                height: 300px;
            }
            
            .filter-controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .back-btn {
                position: static;
                transform: none;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-btn">← Back</a>
            <h1>📊 CPU Benchmark Charts</h1>
            <p>Browse all CPU benchmarks with interactive charts</p>
        </div>
        
        <div class="filter-section">
            <div class="filter-controls">
                <div class="filter-group">
                    <label for="category-filter">Category</label>
                    <select id="category-filter" class="filter-select">
                        <option value="">All Categories</option>
                        <option value="productivity">Productivity</option>
                        <option value="gaming">Gaming</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="resolution-filter">Resolution</label>
                    <select id="resolution-filter" class="filter-select">
                        <option value="">All Resolutions</option>
                        <option value="1080p">1080p</option>
                        <option value="1440p">1440p</option>
                        <option value="4K">4K</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="sort-filter">Sort By</label>
                    <select id="sort-filter" class="filter-select">
                        <option value="name">Name</option>
                        <option value="results">Result Count</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="charts-section">
            <div id="loading" class="loading">
                Loading CPU benchmarks...
            </div>
            
            <div id="charts-container"></div>
        </div>
    </div>

    <script>
        let allBenchmarks = [];
        let chartInstances = [];
        
        // Load benchmarks on page load
        window.onload = function() {
            loadBenchmarks();
            setupFilters();
        };

        function setupFilters() {
            const categoryFilter = document.getElementById('category-filter');
            const resolutionFilter = document.getElementById('resolution-filter');
            const sortFilter = document.getElementById('sort-filter');
            
            [categoryFilter, resolutionFilter, sortFilter].forEach(filter => {
                filter.addEventListener('change', filterAndDisplayBenchmarks);
            });
        }

        async function loadBenchmarks() {
            try {
                const response = await fetch('/api/benchmarks/grouped?type=CPU');
                const data = await response.json();
                
                // Flatten the grouped data
                allBenchmarks = [
                    ...data.productivity.map(b => ({ ...b, category: 'productivity' })),
                    ...Object.values(data.gaming).flat().map(b => ({ ...b, category: 'gaming' }))
                ];
                
                document.getElementById('loading').style.display = 'none';
                filterAndDisplayBenchmarks();
                
            } catch (error) {
                console.error('Error loading benchmarks:', error);
                document.getElementById('loading').textContent = 'Error loading benchmarks';
            }
        }

        function filterAndDisplayBenchmarks() {
            const categoryFilter = document.getElementById('category-filter').value;
            const resolutionFilter = document.getElementById('resolution-filter').value;
            const sortFilter = document.getElementById('sort-filter').value;
            
            let filtered = allBenchmarks.filter(benchmark => {
                if (categoryFilter && benchmark.category !== categoryFilter) return false;
                if (resolutionFilter && benchmark.resolution !== resolutionFilter) return false;
                return true;
            });
            
            // Sort benchmarks
            filtered.sort((a, b) => {
                if (sortFilter === 'results') {
                    return b.result_count - a.result_count;
                } else {
                    return a.name.localeCompare(b.name);
                }
            });
            
            displayBenchmarks(filtered);
        }

        function displayBenchmarks(benchmarks) {
            // Clear existing charts
            chartInstances.forEach(chart => chart.destroy());
            chartInstances = [];
            
            const container = document.getElementById('charts-container');
            container.innerHTML = '';
            
            if (benchmarks.length === 0) {
                container.innerHTML = '<div class="no-data">No benchmarks match the selected filters</div>';
                return;
            }
            
            // Group benchmarks
            const groups = groupBenchmarks(benchmarks);
            
            // Create chart groups
            Object.keys(groups).forEach(groupName => {
                const groupDiv = createBenchmarkGroup(groupName, groups[groupName]);
                container.appendChild(groupDiv);
            });
        }

        function groupBenchmarks(benchmarks) {
            const groups = {};
            
            benchmarks.forEach(benchmark => {
                let groupName;
                
                if (benchmark.category === 'productivity') {
                    groupName = 'Productivity Benchmarks';
                } else {
                    // Extract game name for gaming benchmarks
                    groupName = benchmark.name;
                    if (groupName.includes('CPU Performance')) {
                        groupName = groupName.split(' CPU Performance')[0] + ' Gaming';
                    } else {
                        groupName = 'Gaming Benchmarks';
                    }
                }
                
                if (!groups[groupName]) {
                    groups[groupName] = [];
                }
                groups[groupName].push(benchmark);
            });
            
            return groups;
        }

        function createBenchmarkGroup(groupName, benchmarks) {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'benchmark-group';
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'group-title';
            titleDiv.textContent = groupName;
            groupDiv.appendChild(titleDiv);
            
            const chartsGrid = document.createElement('div');
            chartsGrid.className = 'charts-grid';
            
            benchmarks.forEach(benchmark => {
                const chartContainer = createChartContainer(benchmark);
                chartsGrid.appendChild(chartContainer);
            });
            
            groupDiv.appendChild(chartsGrid);
            return groupDiv;
        }

        function createChartContainer(benchmark) {
            const container = document.createElement('div');
            container.className = 'chart-container';
            
            const header = document.createElement('div');
            header.className = 'chart-header';
            
            const title = document.createElement('div');
            title.className = 'chart-title';
            title.textContent = benchmark.name;
            
            const description = document.createElement('div');
            description.className = 'chart-description';
            description.textContent = benchmark.description || 'CPU performance benchmark';
            
            const unit = document.createElement('div');
            unit.className = 'chart-unit';
            unit.textContent = `Measured in ${benchmark.unit_type}${benchmark.resolution ? ` at ${benchmark.resolution}` : ''}`;
            
            header.appendChild(title);
            header.appendChild(description);
            header.appendChild(unit);
            
            const canvasContainer = document.createElement('div');
            canvasContainer.className = 'chart-canvas';
            
            const canvas = document.createElement('canvas');
            canvas.id = `chart-${benchmark.id}`;
            canvasContainer.appendChild(canvas);
            
            container.appendChild(header);
            container.appendChild(canvasContainer);
            
            // Load chart data
            loadChartData(benchmark.id, canvas);
            
            return container;
        }

        async function loadChartData(benchmarkId, canvas) {
            try {
                const response = await fetch(`/api/benchmark/${benchmarkId}/chart-data`);
                const data = await response.json();
                
                if (data.labels.length === 0) {
                    canvas.parentElement.innerHTML = '<div class="no-data">No data available for this benchmark</div>';
                    return;
                }
                
                createChart(canvas, data);
                
            } catch (error) {
                console.error('Error loading chart data:', error);
                canvas.parentElement.innerHTML = '<div class="no-data">Error loading chart data</div>';
            }
        }

        function createChart(canvas, data) {
            const isTimeBasedChart = data.benchmark.unit_type === 'seconds';
            
            // Limit to top 15 results for readability
            const maxResults = 15;
            const labels = data.labels.slice(0, maxResults);
            const scores = data.data.slice(0, maxResults);
            const colors = data.colors.slice(0, maxResults);
            
            const chart = new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: data.benchmark.unit_type,
                        data: scores,
                        backgroundColor: colors,
                        borderColor: colors,
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y', // This makes it horizontal
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed.x;
                                    return `${value.toFixed(1)} ${data.benchmark.unit_type}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            reverse: isTimeBasedChart, // For time-based charts, lower is better
                            title: {
                                display: true,
                                text: data.benchmark.unit_type
                            }
                        },
                        y: {
                            // Product names on the left - no rotation needed
                        }
                    },
                    layout: {
                        padding: {
                            top: 10,
                            bottom: 10
                        }
                    }
                }
            });
            
            chartInstances.push(chart);
        }
    </script>
</body>
</html>
